name: Python CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "deploy/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py web.py grant_workflow.py

      - name: Run report structure regression tests
        run: python -m unittest discover -s tests -v
      - name: Check required deployment files
        run: |
          test -f vercel.json
          test -f requirements.txt
          test -f templates/index.html
          test -f templates/loading.html
          test -f templates/result.html
          test -f public/style.css
          test -f public/main.js

      - name: Smoke-test Flask routes
        run: |
          python - <<'PY'
          import os
          from unittest.mock import patch
          from web import app

          app.config["TESTING"] = True
          client = app.test_client()

          home = client.get("/")
          assert home.status_code == 200, home.status_code
          assert b"AI Grant Writer" in home.data

          empty = client.post("/run-grant-writer", json={})
          assert empty.status_code == 400, empty.status_code

          with patch.dict(os.environ, {}, clear=True):
              missing_keys = client.post(
                  "/run-grant-writer",
                  json={"org_type": "NGO", "mission": "Improve rural education"}
              )
          assert missing_keys.status_code == 503, missing_keys.status_code
          print("Flask smoke tests passed.")
          PY
